<!doctype html>
<html lang="zh-CN" data-theme="minecraft">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zier工作能量条</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="overrides.css">
</head>
<body>
  <main class="widget">
    <header class="mini-bar">
      <div class="drag-zone">
        <span class="status-dot"></span>
        <div class="clock-copy"><b id="countdown">还有 02:18:35 下班</b><small id="schedule">09:00 — 18:00</small></div>
      </div>
      <time class="current-time" id="currentTime">10:30</time><div class="battery" id="battery" title="今日剩余工作能量"><canvas id="batteryCanvas"></canvas><span id="progressText">100%</span></div>
      <button class="icon-btn expand" id="expandBtn" title="展开">▴</button>
      <button class="icon-btn close" id="closeBtn" title="关闭">×</button>
    </header>

    <section class="drawer" id="drawer">
      <div class="weather-card">
        <div><span class="weather-icon" id="weatherIcon">☁️</span><div><b id="weatherText">自动定位 · 获取中</b><small id="weatherTime">中国天气网</small></div></div>
        <strong id="temperature">--℃</strong>
        <div class="weather-grid"><span>💧 <b id="humidity">--</b></span><span>🌬️ <b id="wind">--</b></span><span>🌧️ <b id="rain">--</b></span></div>
      </div>

      <div class="settings">
        <div class="section-title"><b>插件设置</b><span>自动保存</span></div>
        <div class="time-row">
          <label>上班<input type="time" id="startTime" value="09:00"></label>
          <span>→</span>
          <label>下班<input type="time" id="endTime" value="18:00"></label>
        </div>
        <div class="location-row"><label>天气城市<input id="weatherCity" placeholder="留空即自动定位"></label><button id="locateWeather" title="重新自动定位">📍</button></div>
        <label class="toggle-row"><span><b>桌面置顶</b><small>始终显示在其他窗口上方</small></span><input type="checkbox" id="alwaysOnTop" checked><i></i></label>
        <div class="theme-row"><span>主题风格</span><div class="theme-pills"><button data-theme="minecraft" class="active">方块世界</button><button data-theme="glass">蓝紫玻璃</button><button data-theme="mono">极简黑白</button><button id="communityBtn">社区＋</button></div></div>
      </div>
      <div class="footer-note"><span>今日能量按工作时段量化</span><div><button id="advancedBtn">⚙ 更多设置</button><button id="refreshWeather">刷新天气 ↻</button></div></div>
    </section>
    <section class="advanced-panel" id="advancedPanel" hidden>
      <div class="community-head"><div><b>能量条设置</b><small>显示内容、工资换算、尺寸与启动方式</small></div><button id="closeAdvanced">×</button></div>
      <div class="advanced-card">
        <div class="direction-row display-mode-row"><span><b>中间区域显示</b><small>可显示电量，或按秒累计今日收入</small></span><div class="segment"><button id="displayEnergy" data-display="energy">工作电量</button><button id="displayEarnings" data-display="earnings">实时收入</button></div></div>
        <div class="earnings-settings" id="earningsSettings">
          <label><span>月工资（元）</span><input type="number" id="monthlySalary" min="0" step="100" placeholder="例如 8000"></label>
          <label><span>每月工作天数</span><input type="number" id="workDays" min="1" max="31" step="1" placeholder="例如 22"></label>
          <label class="earnings-copy"><span>收入文案（{amount} 为金额）</span><input id="earningsLabel" maxlength="30" placeholder="今天赚了 {amount} 元"></label>
          <small class="formula-preview" id="formulaPreview">填写工资后显示每秒收入</small>
        </div>
        <label class="range-row"><span><b>插件框体长度</b><small id="widgetWidthValue">460 px</small></span><input type="range" id="widgetWidth" min="400" max="720" step="10" value="460"></label>
        <label class="range-row"><span><b>插件框体高度</b><small id="widgetHeightValue">48 px</small></span><input type="range" id="widgetHeight" min="44" max="72" step="2" value="48"></label>
        <div class="direction-row"><span><b>电量变化方向</b><small>选择工作进度的显示方式</small></span><div class="segment"><button id="directionDown" data-direction="down">100 → 0</button><button id="directionUp" data-direction="up">0 → 100</button></div></div>
        <label class="toggle-row startup-row"><span><b>开机自动启动</b><small>登录 Windows 后自动运行</small></span><input type="checkbox" id="autoStartup"><i></i></label>
      </div>
      <p class="advanced-tip">设置会立即生效并自动保存在本机。</p>
    </section>
    <section class="community-panel" id="communityPanel" hidden>
      <div class="community-head"><div><b>TweakCN 社区主题</b><small>选择预设，或导入主题链接/CSS</small></div><button id="closeCommunity">×</button></div>
      <div class="community-grid" id="communityGrid"></div>
      <button class="community-link" id="openTweakCN">更多社区主题 · 打开 TweakCN 获取 ↗</button>
      <label class="import-label">主题链接或 CSS<textarea id="themeImport" placeholder="粘贴 tweakcn.com/themes/... 链接，或 :root { --background: ... }"></textarea></label>
      <div class="import-actions"><span id="importStatus">主题仅保存在本机</span><button id="importTheme">导入并应用</button></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
