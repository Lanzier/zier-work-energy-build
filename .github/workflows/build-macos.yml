name: Build macOS installers

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build unsigned DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Zier-Work-Energy-Bar-macOS-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
      - name: Publish DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.1
          name: Zier Work Energy Bar v2.4.1
          files: dist/*.dmg
